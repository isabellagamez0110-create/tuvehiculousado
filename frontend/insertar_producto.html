<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Insertar vehículo - Tu Vehículo Usado</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div
        class="card shadow-sm mx-auto"
        style="max-width: 650px;">

        <div class="card-body p-4">


            <h2 class="text-center mb-2">
                Insertar vehículo
            </h2>


            <p class="text-center text-muted mb-4">
                Registra un nuevo vehículo en el sistema.
            </p>


            <form id="producto-form">


                <!-- TIPO -->

                <div class="mb-3">

                    <label
                        for="tipo"
                        class="form-label">

                        Tipo de vehículo

                    </label>


                    <select
                        id="tipo"
                        class="form-select"
                        required>

                        <option value="">
                            Selecciona un tipo
                        </option>

                        <option value="Carro">
                            Carro
                        </option>

                        <option value="Moto">
                            Moto
                        </option>

                    </select>

                </div>



                <!-- MARCA -->

                <div class="mb-3">

                    <label
                        for="marca"
                        class="form-label">

                        Marca

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="marca"
                        placeholder="Ej: Toyota"
                        required>

                </div>



                <!-- MODELO -->

                <div class="mb-3">

                    <label
                        for="modelo"
                        class="form-label">

                        Modelo

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        id="modelo"
                        placeholder="Ej: Corolla"
                        required>

                </div>



                <!-- AÑO -->

                <div class="mb-3">

                    <label
                        for="anio"
                        class="form-label">

                        Año

                    </label>


                    <input
                        type="number"
                        class="form-control"
                        id="anio"
                        placeholder="Ej: 2024"
                        min="1900"
                        max="2100"
                        required>

                </div>



                <!-- PRECIO -->

                <div class="mb-3">

                    <label
                        for="precio"
                        class="form-label">

                        Precio

                    </label>


                    <input
                        type="number"
                        class="form-control"
                        id="precio"
                        placeholder="Ej: 50000000"
                        min="0"
                        required>

                </div>



                <!-- CANTIDAD -->

                <div class="mb-3">

                    <label
                        for="cantidad"
                        class="form-label">

                        Cantidad disponible

                    </label>


                    <input
                        type="number"
                        class="form-control"
                        id="cantidad"
                        placeholder="Ej: 1"
                        min="0"
                        required>

                </div>



                <!-- DESCRIPCIÓN -->

                <div class="mb-3">

                    <label
                        for="descripcion"
                        class="form-label">

                        Descripción

                    </label>


                    <textarea
                        id="descripcion"
                        class="form-control"
                        rows="4"
                        placeholder="Describe el vehículo..."
                        required></textarea>

                </div>



                <!-- IMAGEN -->

                <div class="mb-3">

                    <label
                        for="imagen"
                        class="form-label">

                        URL de imagen

                    </label>


                    <input
                        type="url"
                        class="form-control"
                        id="imagen"
                        placeholder="https://ejemplo.com/vehiculo.jpg">

                </div>



                <!-- BOTÓN -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Guardar vehículo

                    </button>

                </div>


            </form>



            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="alert mt-4 d-none">
            </div>



            <!-- VOLVER -->

            <div class="text-center mt-3">

                <a
                    href="index.html"
                    class="btn btn-secondary">

                    Volver al inicio

                </a>

            </div>


        </div>

    </div>

</div>



<script>


// ==========================================
// FORMULARIO
// ==========================================

document
    .getElementById('producto-form')
    .addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            // ==================================
            // OBTENER DATOS
            // ==================================

            const tipo =
                document
                    .getElementById('tipo')
                    .value;


            const marca =
                document
                    .getElementById('marca')
                    .value
                    .trim();


            const modelo =
                document
                    .getElementById('modelo')
                    .value
                    .trim();


            const anio =
                document
                    .getElementById('anio')
                    .value;


            const precio =
                document
                    .getElementById('precio')
                    .value;


            const cantidad =
                document
                    .getElementById('cantidad')
                    .value;


            const descripcion =
                document
                    .getElementById('descripcion')
                    .value
                    .trim();


            const imagen =
                document
                    .getElementById('imagen')
                    .value
                    .trim();


            const mensaje =
                document
                    .getElementById('mensaje');



            // ==================================
            // USUARIO
            // ==================================

            const usuarioGuardado =
                localStorage.getItem("usuario");


            if (!usuarioGuardado) {

                mensaje.className =
                    'alert alert-danger mt-4';

                mensaje.textContent =
                    'No hay una sesión iniciada.';

                return;

            }


            const usuario =
                JSON.parse(
                    usuarioGuardado
                );



            // ==================================
            // VERIFICAR ADMINISTRADOR
            // ==================================

            if (
                usuario.rol !==
                "administrador"
            ) {

                mensaje.className =
                    'alert alert-danger mt-4';

                mensaje.textContent =
                    'Solo los administradores pueden crear vehículos.';

                return;

            }



            try {


                // ==================================
                // ENVIAR AL BACKEND
                // ==================================

                const respuesta =
                    await fetch(
                        '/api/productos',
                        {

                            method: 'POST',


                            headers: {

                                'Content-Type':
                                    'application/json',

                                'rol':
                                    usuario.rol

                            },


                            body:
                                JSON.stringify({

                                    tipo:
                                        tipo,

                                    marca:
                                        marca,

                                    modelo:
                                        modelo,

                                    anio:
                                        Number(anio),

                                    precio:
                                        Number(precio),

                                    cantidad:
                                        Number(cantidad),

                                    descripcion:
                                        descripcion,

                                    imagen:
                                        imagen || null

                                })

                        }
                    );



                // ==================================
                // RESPUESTA
                // ==================================

                const data =
                    await respuesta.json();



                if (!respuesta.ok) {

                    throw new Error(
                        data.error ||
                        'No se pudo crear el vehículo'
                    );

                }



                // ==================================
                // ÉXITO
                // ==================================

                mensaje.className =
                    'alert alert-success mt-4';

                mensaje.textContent =
                    'Vehículo creado correctamente.';



                document
                    .getElementById(
                        'producto-form'
                    )
                    .reset();



            } catch (error) {


                console.error(
                    'Error:',
                    error
                );


                mensaje.className =
                    'alert alert-danger mt-4';

                mensaje.textContent =
                    'Error al crear el vehículo: ' +
                    error.message;

            }

        }

    );

</script>


</body>

</html>
