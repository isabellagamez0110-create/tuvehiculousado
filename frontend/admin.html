<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tu Vehículo Usado | Panel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f6f8;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #111827,
                #374151
            );

            color: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .table thead th {
            white-space: nowrap;
        }

        .precio {
            font-weight: 600;
        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Tu Vehículo Usado
        </span>


        <button
            onclick="cerrarSesion()"
            class="btn btn-outline-light btn-sm">

            Cerrar sesión

        </button>

    </div>

</nav>



<div class="container py-4">


    <!-- ==========================================
         ENCABEZADO
    ========================================== -->

    <div class="hero">

        <h1 class="mb-2">

            Panel de administración

        </h1>


        <p
            id="bienvenida"
            class="mb-0">
        </p>

    </div>



    <!-- ==========================================
         OPCIONES DEL ADMINISTRADOR
    ========================================== -->

    <div
        id="opcionesAdmin"
        class="mb-4"
        style="display: none;">

        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="mb-3">

                    Administración

                </h4>


                <p class="text-muted">

                    Gestiona los usuarios registrados
                    en el sistema.

                </p>


                <a
                    href="usuarios.html"
                    class="btn btn-primary">

                    Gestionar usuarios

                </a>

            </div>

        </div>

    </div>



    <!-- ==========================================
         VEHÍCULOS
    ========================================== -->

    <div
        class="d-flex justify-content-between align-items-center mb-3">

        <div>

            <h3 class="mb-1">

                Vehículos

            </h3>


            <p class="text-muted mb-0">

                Consulta los vehículos disponibles
                en el sistema.

            </p>

        </div>


        <a
            href="insertar_producto.html"
            class="btn btn-dark">

            Agregar vehículo

        </a>

    </div>



    <!-- ==========================================
         TABLA
    ========================================== -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Vehículo</th>

                            <th>Marca</th>

                            <th>Modelo</th>

                            <th>Año</th>

                            <th>Tipo</th>

                            <th>Precio</th>

                            <th>Cantidad</th>

                        </tr>

                    </thead>


                    <tbody id="vehiculos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- ==========================================
         MENSAJE
    ========================================== -->

    <div
        id="mensaje"
        class="mt-3">
    </div>


</div>



<script>


// ==========================================
// URL DEL MICROservicio
// ==========================================

const URL_VEHICULOS =
    "/api/productos";



// ==========================================
// COMPROBAR USUARIO
// ==========================================

const usuarioGuardado =
    localStorage.getItem("usuario");


if (!usuarioGuardado) {

    window.location.href =
        "index.html";

}


const usuario =
    JSON.parse(usuarioGuardado);



// ==========================================
// VALIDAR ROL
// ==========================================

if (
    usuario.rol !== "vendedor" &&
    usuario.rol !== "administrador"
) {

    window.location.href =
        "index.html";

}



// ==========================================
// BIENVENIDA
// ==========================================

document.getElementById(
    "bienvenida"
).textContent =
    "Bienvenido, " + usuario.nombre;



// ==========================================
// MOSTRAR OPCIONES DE ADMINISTRADOR
// ==========================================

if (
    usuario.rol === "administrador"
) {

    document.getElementById(
        "opcionesAdmin"
    ).style.display = "block";

}



// ==========================================
// CARGAR VEHÍCULOS
// ==========================================

async function cargarVehiculos() {


    const tabla =
        document.getElementById(
            "vehiculos"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    tabla.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="text-center py-4">

                Cargando vehículos...

            </td>

        </tr>

    `;


    mensaje.innerHTML = "";


    try {


        const respuesta =
            await fetch(
                URL_VEHICULOS
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                "No se pudieron consultar los vehículos"
            );

        }


        if (
            !Array.isArray(datos) ||
            datos.length === 0
        ) {

            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="text-center py-4 text-muted">

                        No hay vehículos registrados.

                    </td>

                </tr>

            `;

            return;

        }


        tabla.innerHTML = "";


        datos.forEach(
            vehiculo => {


                const fila =
                    document.createElement(
                        "tr"
                    );


                fila.innerHTML = `

                    <td>
                        ${vehiculo.id}
                    </td>


                    <td>

                        <strong>
                            ${vehiculo.nombre || "Vehículo"}
                        </strong>

                        ${
                            vehiculo.descripcion
                            ?

                            `<br>
                             <small class="text-muted">
                                ${vehiculo.descripcion}
                             </small>`

                            :

                            ""
                        }

                    </td>


                    <td>
                        ${vehiculo.marca || "-"}
                    </td>


                    <td>
                        ${vehiculo.modelo || "-"}
                    </td>


                    <td>
                        ${vehiculo.anio || "-"}
                    </td>


                    <td>
                        ${vehiculo.tipo || "-"}
                    </td>


                    <td class="precio">

                        $ ${Number(
                            vehiculo.precio || 0
                        ).toLocaleString(
                            "es-CO"
                        )}

                    </td>


                    <td>

                        ${
                            Number(
                                vehiculo.cantidad
                            ) > 0

                            ?

                            `<span class="badge text-bg-success">
                                ${vehiculo.cantidad}
                             </span>`

                            :

                            `<span class="badge text-bg-secondary">
                                Agotado
                             </span>`
                        }

                    </td>

                `;


                tabla.appendChild(
                    fila
                );

            }
        );


    } catch (error) {


        console.error(
            "Error:",
            error
        );


        tabla.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="text-center py-4 text-danger">

                    No fue posible cargar los vehículos.

                </td>

            </tr>

        `;


        mensaje.innerHTML = `

            <div class="alert alert-danger">

                ${error.message}

            </div>

        `;

    }

}



// ==========================================
// CERRAR SESIÓN
// ==========================================

function cerrarSesion() {

    localStorage.removeItem(
        "usuario"
    );


    window.location.href =
        "index.html";

}



// ==========================================
// INICIAR
// ==========================================

cargarVehiculos();


</script>


</body>

</html>
