global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend entrada_http
    bind *:8080

    acl ruta_usuarios path_beg /api/usuarios
    acl ruta_productos path_beg /api/productos
    acl ruta_compras path_beg /api/compras

    use_backend servicio_usuarios if ruta_usuarios
    use_backend servicio_vehiculos if ruta_productos
    use_backend servicio_compras if ruta_compras

    default_backend servicio_usuarios

backend servicio_usuarios
    option httpchk GET /health
    server usuarios usuarios:3010 check

backend servicio_vehiculos
    option httpchk GET /health
    server vehiculos vehiculos:3011 check

backend servicio_compras
    option httpchk GET /health
    server compras compras:3012 check
